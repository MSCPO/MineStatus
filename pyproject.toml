[project]
name = "minestatus"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi (>=0.141.0,<0.142.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "mcstatus (>=14.1.0,<15.0.0)",
]

[project.optional-dependencies]
test = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.24.0,<1.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
]

# Application project: uv sync installs dependencies only,
# no root package build (keeps uv independent of poetry).
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
